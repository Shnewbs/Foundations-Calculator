name: Validate beta real client
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beta-client.yml'
      - 'tools/check_beta_client.py'
      - 'src/gameTest/java/com/foundations/calculator/ClientSmoke.java'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calculator-beta-client
  cancel-in-progress: true
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install a native software OpenGL display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libflite1
      - name: Real client menus, processing, resource reload and screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x960x24' python3 tools/check_beta_client.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calculator-beta-real-client
          path: |
            validation/beta-client/
            validation/screenshots/
            run/logs/
            run/crash-reports/
