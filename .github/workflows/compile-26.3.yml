name: Compile Calculator 26.3 port
on:
  push:
    branches: ['port/26.3']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calculator-26.3-compile
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Native platform tests and full compile
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testPortEnergy compileJava --console=plain 2>&1 | tee port-compile.log
      - name: Capture native API signatures for the remaining migration
        if: always()
        shell: bash
        run: |
          set -o pipefail
          ./gradlew capturePortApi captureFuelImplementation --console=plain 2>&1 | tee port-api.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calculator-26.3-compile-evidence
          path: |
            port-compile.log
            port-api.log
            build/test-results/testPortEnergy/
            build/reports/tests/testPortEnergy/
