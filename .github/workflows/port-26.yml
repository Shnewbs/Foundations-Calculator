name: Compile experimental 26.3 port
on:
  push:
    branches: [port/26.3]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile against real 26.3 APIs
        run: bash gradlew compileJava --console=plain
