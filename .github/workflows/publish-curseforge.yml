name: Publish Calculator to CurseForge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-curseforge.yml', 'tools/publish_curseforge.py']
  workflow_run:
    workflows: ['Publish validated Calculator update']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing audited GitHub release tag
        required: true
        default: v0.0.5a.R1
        type: string
permissions:
  contents: write
concurrency:
  group: calculator-curseforge
  cancel-in-progress: false
jobs:
  upload:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select audited GitHub release and skip completed uploads
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-v$(sed -n 's/^mod_version=//p' gradle.properties)}"
          [[ "$tag" =~ ^v[0-9A-Za-z.-]+$ ]]
          gh release view "$tag" --json tagName,assets,body > release.json
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if jq -e '.assets[] | select(.name == "curseforge-upload.json")' release.json >/dev/null; then
            echo 'Already uploaded to CurseForge; skipping.'
            echo 'upload=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p release-assets
          gh release download "$tag" --pattern "FoundationsCalculator-${tag#v}.jar" --pattern release_checks.json --dir release-assets
          jq -r '.body' release.json > release-assets/release-notes.md
          echo 'upload=true' >> "$GITHUB_OUTPUT"
      - name: Upload exact audited binary with candidate release type
        if: steps.release.outputs.upload == 'true'
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: python tools/publish_curseforge.py --version "$VERSION"
      - name: Record accepted CurseForge file on GitHub release
        if: steps.release.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" release-assets/curseforge-upload.json
      - name: Retain upload receipt even if GitHub receipt attachment fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curseforge-upload-receipt-${{ github.run_id }}
          path: release-assets/curseforge-upload.json
          if-no-files-found: ignore
