name: Publish validated Calculator update
on:
  workflow_run:
    workflows: ['Validate and release Calculator']
    types: [completed]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download passing build and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN: ${{ github.event.workflow_run.id }}
        run: gh run download "$VALIDATED_RUN" --name calculator-validation --dir validated
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish versioned alpha or beta and upload to CurseForge
        env:
          GH_TOKEN: ${{ github.token }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          VALIDATED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if test "$current" != "$VALIDATED_COMMIT"; then
            echo "A newer main commit exists; waiting for its validation."
            exit 0
          fi
          python tools/publish_prerelease.py --directory validated/build/libs --audit "validated/validation/$version/release_checks.json" --version "$version"
      - name: Retain CurseForge receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-curseforge-receipt
          path: build/curseforge-upload.json
          if-no-files-found: ignore
