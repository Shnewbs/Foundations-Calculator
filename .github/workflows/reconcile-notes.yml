name: Reconcile checkpoint release notes
on:
  push:
    branches: [release/notes]
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record completed checkpoint validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.0.3a-dev.1 --notes-file docs/releases/0.0.3a-dev.1.md
