name: Validate and release Calculator
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
concurrency:
  group: calculator-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native build, integrations and audited release evidence
        run: python tools/validate_release.py
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-validation
          path: |
            build/libs/
            build/test-results/
            build/gametest-output.log
            validation/
      - name: Publish passing tagged candidate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test "$GITHUB_REF_NAME" = "v$version"
          if jq -e '.release_eligible == false' "validation/$version/release_checks.json" >/dev/null; then
            echo "Candidate build retained; beta acceptance gates remain pending."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar --verify-tag --prerelease --title "Foundations Calculator $version" --notes-file CHANGELOG.md
